{% extends "base.html" %}
{% block title %}Create account · Semaphore{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ form.get('username', '') }}"
             autocomplete="username" autofocus required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" data-reveal required>
      <small class="muted">At least 8 characters.</small>
    </label>
    <label>Repeat password
      <input name="confirm" type="password" autocomplete="new-password" required>
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
</div>
{% endblock %}
